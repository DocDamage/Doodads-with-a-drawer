name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # Linux runs the suites once, under coverage; Windows runs them in verify.
      - if: runner.os != 'Linux'
        run: npm run verify
      - if: runner.os == 'Linux'
        run: npm run verify -- --skip-tests
      - if: runner.os == 'Linux'
        run: npm run coverage
